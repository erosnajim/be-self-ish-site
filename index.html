<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self-ish</title>
<style>
  :root { --ink:#2e2a26; --soft:#6b625a; --bg:#fbf7f1; --card:#ffffff; --line:#e9e0d4; --accent:#b5884e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:680px; margin:0 auto; padding:48px 20px 72px; }
  header { margin-bottom:28px; }
  h1 { font-size:30px; margin:0 0 6px; letter-spacing:-0.01em; }
  .sub { color:var(--soft); margin:0; }
  main { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h2 { font-size:19px; margin:28px 0 6px; }
  h2:first-child { margin-top:0; }
  .q { font-weight:600; margin:18px 0 2px; }
  a { color:var(--accent); }
  .muted { color:var(--soft); font-size:15px; }
  footer { margin-top:24px; text-align:center; }
  .contact { background:#f4ede2; border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin:0 0 6px; }
</style>
</head>
<body>
  <main>
    <h1>Self-ish</h1>
    <p>A cozy nightly check-in. Three tiny friends, one cozy room, a few minutes each night.</p>
    <p><a href="support.html">Support</a> · <a href="privacy.html">Privacy policy</a></p>
  </main>
  <footer class="muted">Self-ish · © 2026 Aldon Acenas</footer>
</body>
</html>
